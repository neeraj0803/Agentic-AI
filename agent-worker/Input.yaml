conversation_id: QE-201-draft-test-cases-from-jira-conversation
workflow_id: QE-201-draft-test-cases-from-jira
version: 1.0.0
status: published
agent:
  id: QE-201
  name: QE Manual Test Case and Regression Drafter
  description: >-
    Retrieves application-specific context and signals, synthesizes a context brief,
    drafts manual test cases with negative scenarios and regression coverage, and submits
    the draft for QE tester/lead review before publishing to Xray or Excel.

actors:
  initiator: qe_tester
  approver: qe_lead

channels:
  allowed:
    - jira
    - platform_ui

run_modes:
  intake: conversational
  execution: async_langgraph
  handoff:
    dispatch_when: required_inputs_confirmed_and_preflight_passed
    worker_backed_conversation: true
    next_turn_minimum_input: configured_required_inputs

inputs:
  - id: jira_story_or_epic_id
    type: source_reference
    required: true
    prompt: Provide the Jira Story, linked stories, or Epic ID (e.g., CHK-100).
    validation:
      kind: reference_or_text

  - id: acceptance_criteria
    type: string
    required: false
    prompt: Provide any additional or overridden acceptance criteria (if not fully defined in Jira).
    validation:
      kind: text

  - id: test_scope_and_type
    type: enum
    required: true
    prompt: Which test scope and types should be prioritized?
    allowed_values:
      - functional_and_negative
      - full_impact_and_regression
      - smoke_and_sanity
      - boundary_and_nfr

  - id: target_application_and_env
    type: string
    required: false
    prompt: Specify the target application service and environment (e.g., Checkout Service / Staging).
    default: auto_resolve_from_jira

  - id: output_preference
    type: enum
    required: true
    prompt: Select your preferred output channel/format.
    allowed_values:
      - xray_record
      - excel_export
      - xray_and_excel

intake:
  confirm_before_run: true
  allow_context_override: true
  allow_skill_selection: true
  allow_user_added_context: true

context:
  required_capabilities:
    - linked_jira_and_prd_content
    - application_modules_apis_and_data_flows
    - xray_and_excel_tests
    - regression_suites_and_defects
    - similar_past_changes_and_production_defects
    - qe_standards_and_nfrs

skills:
  required:
    - skill_id: feature-epic-decomposition
      capability: feature-epic-decomposition
      domain: Macy's Ways of Working (MWoW)
      selection: deterministic
      version: "1.1.0"
      skill_file: skills/feature-epic-decomposition.skill

model_policy_ref: azure_standard_test_generation

graph:
  nodes:
    # 1. Retrieve context from context engine
    - id: context_retriever
      type: context_engine_call
      checkpoint: false

    # 2. Apply Skill: Epic to Story Decomposition
    - id: skill_retriever
      type: skill_call
      skill_ref: feature-epic-decomposition
      checkpoint: false

    # 3. Draft Test Cases, Negative Scenarios, Regression Scope & RTM Matrix
    - id: test_cases_generation
      type: llm_call
      checkpoint: false
    
    - id: skill_retriever
      type: skill_call
      skill_ref: feature-epic-decomposition
      checkpoint: false

    # 4. Format Output Artifacts (Context Brief, RTM Matrix, Test Cases, Export JSON/Excel)
    - id: prepare_test_package_artifacts
      type: artifact_call

  edges:
    - from: context_retriever
      to: skill_retriever
    - from: skill_retriever
      to: test_cases_generation
    - from: test_cases_generation
      to: prepare_test_package_artifacts

outputs:
  artifacts:
    - reviewed_manual_test_cases       # Steps, test data, expected results, positive/negative
    - coverage_and_regression_matrix   # Suggested regression scope to prevent gaps
    - requirement_traceability_matrix  # Bi-directional mapping between ACs and Test IDs
    - assumptions_and_gaps             # Ambiguities and missing information surfaced
    - primary_xray_record              # Xray JSON writeback payload
    - excel_export_file                # Optional test case workbook (.xlsx)

failure_policy:
  dependency_retry: bounded
  terminal_state_on_unrecoverable_error: failed