[project]
name = "agent-worker"
version = "0.1.0"
description = "Agent Worker Service for AI-DLC / MTech Apex Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
