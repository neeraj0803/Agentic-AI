conversation_id: QE-201-draft-test-cases-from-jira-conversation
workflow_id: QE-201-draft-test-cases-from-jira
version: 1.0.0
status: published

agent:
  id: QE-201
  name: QE Manual Test Case and Regression Drafter
  description: >-
    Retrieves context, breaks down epics and user stories, drafts comprehensive test cases, 
    and synthesizes a technical review artifact.

inputs:
  - id: jira_story_or_epic_id
    required: true
  - id: test_scope_and_type
    required: true
    allowed_values:
      - functional_and_negative
      - full_impact_and_regression
      - smoke_and_sanity
      - boundary_and_nfr
  - id: target_application_and_env
    required: false
  - id: output_preference
    required: true
    allowed_values:
      - xray_record
      - excel_export
      - xray_and_excel

graph:
  nodes:
    # 1. Retrieve context from context engine
    - id: context_retriever
      type: context_engine_call
      checkpoint: false

    # 2. Apply Skill: Epic to Story Decomposition
    - id: skill_retriever
      type: skill_call
      skill_ref: feature-epic-decomposition
      checkpoint: false

    # 3. Draft Test Cases, Negative Scenarios, Regression Scope & RTM Matrix
    - id: test_cases_generation
      type: llm_call
      checkpoint: false
    
    - id: skill_retriever_2
      type: skill_call
      skill_ref: feature-epic-decomposition
      checkpoint: false

    # 4. Format Output Artifacts (Context Brief, RTM Matrix, Test Cases, Export JSON/Excel)
    - id: prepare_test_package_artifacts
      type: artifact_call

  edges:
    - from: context_retriever
      to: skill_retriever
    - from: skill_retriever
      to: test_cases_generation
    - from: test_cases_generation
      to: skill_retriever_2
    - from: skill_retriever_2
      to: prepare_test_package_artifacts

outputs:
  templates:
    - manual_test_cases_template:
        - test_id
        - test_title
        - test_type                    # functional, negative, edge/egression
        - linked_acceptance_criteria
        - preconditions_and_test_data
        - step_action
        - step_expected_result
        - qe_approval_status

    - coverage_and_regression_matrix_template:
        - impacted_modules_and_apis
        - suggested_regression_suite_ids
        - regression_test_case_id
        - impact_and_dependency_rationale

    - requirement_traceability_matrix_template:
        - jira_id_or_epic
        - acceptance_criteria_id
        - mapped_test_case_ids
        - coverage_status

    - assumptions_and_gaps_template:
        - missing_requirements
        - data_and_environment_dependencies
        - open_questions_for_po_or_dev

    - primary_xray_record_template:
        - jira_project_key
        - test_issue_type
        - manual_steps_data_results

    - excel_export_file_template:
        - test_cases_sheet
        - rtm_traceability_sheet
        - regression_scope_sheet
        - assumptions_sheet